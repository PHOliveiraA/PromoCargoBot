services:
  promocargobot:          # 2 espaços de recuo
    image: ghcr.io/pholiveiraa/promocargobot:latest
    container_name: promocargobot
    depends_on:
      - lavalink
    env_file: .env
    restart: always
    networks:
      - bot-network

  lavalink:               # 2 espaços de recuo (IGUAL ao promocargobot)
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink
    ports:
      - "2333:2333"
    environment:
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=youshallnotpass
    volumes:
      - ./lavalink/application.yml:/opt/lavalink/application.yml
      - ./lavalink/plugins:/opt/lavalink/plugins
    restart: always
    networks:
      - bot-network

networks:                 # Volta para a margem (0 espaços)
  bot-network:
    driver: bridge